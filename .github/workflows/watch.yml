name: 공지사항 감시

on:
  schedule:
    # 5분마다. GitHub 예약 실행의 공식 최소 보장 간격과 일치시켜
    # 노후 서버(doduck.co.kr)에 불필요한 접속 시도를 줄입니다.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드'
        required: false
        default: 'normal'
        type: choice
        options: [normal, seed, dry-run, login-test, login-test-dump, notify-test, alert-test, telegram-diag, admin-bot-diag, band-diag, test-post, rpost-dump, allposts-diag, allposts-bot-diag, board-survey, test-allpost]
      post_title:
        description: 'test-post/test-allpost 모드일 때만: 글 제목'
        required: false
      post_url:
        description: 'test-post/test-allpost 모드일 때만: 글 상세 URL'
        required: false
      post_board:
        description: 'test-allpost 모드일 때만: 게시판 라벨 (예: 생활지원센터-계약서)'
        required: false

concurrency:
  group: notice-watch
  cancel-in-progress: false

permissions:
  contents: write        # state/seen.json 커밋용

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: 공지 확인 및 알림
        env:
          SITE_ID: ${{ secrets.SITE_ID }}
          SITE_PW: ${{ secrets.SITE_PW }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_BOT_TOKEN: ${{ secrets.TELEGRAM_ADMIN_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          BAND_ACCESS_TOKEN: ${{ secrets.BAND_ACCESS_TOKEN }}
          BAND_KEY: ${{ secrets.BAND_KEY }}
          ALLPOSTS_BOT_TOKEN: ${{ secrets.ALLPOSTS_BOT_TOKEN }}
          ALLPOSTS_CHAT_ID: ${{ secrets.ALLPOSTS_CHAT_ID }}
          ALLPOSTS_CHANNEL_ID: ${{ secrets.ALLPOSTS_CHANNEL_ID }}
        run: |
          case "${{ inputs.mode }}" in
            seed)             node src/index.js --seed ;;
            dry-run)          node src/index.js --dry-run ;;
            login-test)       node src/index.js --login-test ;;
            login-test-dump)  node src/index.js --login-test --dump ;;
            notify-test)      node tools/test-notify.mjs ;;
            alert-test)       node tools/test-alert.mjs ;;
            telegram-diag)    node tools/telegram-chatid.mjs ;;
            admin-bot-diag)   TELEGRAM_BOT_TOKEN="$TELEGRAM_ADMIN_BOT_TOKEN" node tools/telegram-chatid.mjs ;;
            band-diag)        node tools/band-diag.mjs ;;
            test-post)        node tools/test-post.mjs "${{ inputs.post_title }}" "${{ inputs.post_url }}" ;;
            rpost-dump)       node tools/rpost-dump.mjs ;;
            allposts-diag)    node src/allposts.js --dry-run ;;
            allposts-bot-diag) TELEGRAM_BOT_TOKEN="$ALLPOSTS_BOT_TOKEN" node tools/telegram-chatid.mjs ;;
            board-survey)     node tools/board-survey.mjs ;;
            test-allpost)     node tools/test-allpost.mjs "${{ inputs.post_board }}" "${{ inputs.post_title }}" "${{ inputs.post_url }}" ;;
            *)                node src/index.js ;;
          esac

      - name: 전체 게시글 감시 (공지사항 제외)
        # 진단 전용 모드(login-test 등)에서는 건너뜁니다. schedule 트리거·normal·seed·dry-run에서 실행됩니다.
        if: >-
          always() &&
          !contains(
            fromJSON('["login-test","login-test-dump","notify-test","alert-test","telegram-diag","admin-bot-diag","band-diag","test-post","rpost-dump","allposts-diag","allposts-bot-diag","board-survey","test-allpost"]'),
            github.event.inputs.mode
          )
        env:
          SITE_ID: ${{ secrets.SITE_ID }}
          SITE_PW: ${{ secrets.SITE_PW }}
          ALLPOSTS_BOT_TOKEN: ${{ secrets.ALLPOSTS_BOT_TOKEN }}
          ALLPOSTS_CHAT_ID: ${{ secrets.ALLPOSTS_CHAT_ID }}
          ALLPOSTS_CHANNEL_ID: ${{ secrets.ALLPOSTS_CHANNEL_ID }}
        run: |
          case "${{ inputs.mode }}" in
            seed)      node src/allposts.js --seed ;;
            dry-run)   node src/allposts.js --dry-run ;;
            *)         node src/allposts.js ;;
          esac

      - name: 상태 저장
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git config user.name  "notice-watcher"
            git config user.email "actions@github.com"
            git add state/
            git commit -m "chore: 확인한 공지 기록 갱신 [skip ci]"
            git push
          else
            echo "변경 없음"
          fi
