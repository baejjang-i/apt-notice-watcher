name: 공지사항 감시

on:
  schedule:
    # 5분마다. GitHub 예약 실행의 공식 최소 보장 간격과 일치시켜
    # 노후 서버(doduck.co.kr)에 불필요한 접속 시도를 줄입니다.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드'
        required: false
        default: 'normal'
        type: choice
        options: [normal, seed, dry-run, login-test, notify-test, telegram-diag]

concurrency:
  group: notice-watch
  cancel-in-progress: false

permissions:
  contents: write        # state/seen.json 커밋용

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: 공지 확인 및 알림
        env:
          SITE_ID: ${{ secrets.SITE_ID }}
          SITE_PW: ${{ secrets.SITE_PW }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          case "${{ inputs.mode }}" in
            seed)          node src/index.js --seed ;;
            dry-run)       node src/index.js --dry-run ;;
            login-test)    node src/index.js --login-test ;;
            notify-test)   node tools/test-notify.mjs ;;
            telegram-diag) node tools/telegram-chatid.mjs ;;
            *)             node src/index.js ;;
          esac

      - name: 상태 저장
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git config user.name  "notice-watcher"
            git config user.email "actions@github.com"
            git add state/
            git commit -m "chore: 확인한 공지 기록 갱신 [skip ci]"
            git push
          else
            echo "변경 없음"
          fi
